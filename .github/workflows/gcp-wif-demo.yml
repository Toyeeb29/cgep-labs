# .github/workflows/gcp-wif-demo.yml
# Demo workflow: authenticates to GCP via WIF — no service-account JSON key anywhere
name: GCP WIF Demo

on:
  workflow_dispatch:

permissions:
  id-token: write   # required to mint the OIDC token
  contents: read

jobs:
  gcp-auth-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP via WIF
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/441514705305/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: cgep-grc-gate-sa@cgep-501201.iam.gserviceaccount.com

      - name: Verify GCP auth (read-only)
        run: gcloud storage ls
